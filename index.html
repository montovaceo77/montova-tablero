/* ---------- Ciclos: productividad de ciclos cerrados ---------- */
state.cy={open:null,all:false};
function cicloMetricas(c){
  const U=c.sala.reduce((s,r)=>s+r.util,0),X=c.sala.reduce((s,r)=>s+r.desc,0);
  const rates=c.monDates.map(d=>stats(c.mon.filter(m=>m.fecha===d)).rate).filter(x=>x!=null);
  const tipos={},mot={};c.sala.forEach(r=>{if(r.util){const k=tipoStd(r.tipo);tipos[k]=(tipos[k]||0)+r.util}if(r.desc){const k=(r.motivo||"Sin motivo").trim();mot[k]=(mot[k]||0)+r.desc}});
  return {U,X,cama:c.camas?U/c.camas:null,planta:c.plantas?U/c.plantas:null,desc:U+X?X/(U+X):null,
    inc:rates.length?rates.reduce((a,b)=>a+b,0)/rates.length:null,ab:c.abon.length,fu:c.fum.length,tipos,mot};
}
const GRADOS=["Mini","Fancy","Select","Premium","Jumbo"];
const ordenGrados=o=>Object.keys(o).sort((a,b)=>{const i=GRADOS.indexOf(a),j=GRADOS.indexOf(b);return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b)});
function renderCiclos(){
  const body=document.getElementById("cyBody");if(!body)return;
  document.getElementById("cySub").textContent=`Elige un lote para comparar sus ciclos. Medida principal: tallos útiles por grado.`;
  const cs=M.cycles.filter(c=>c.finca===state.finca&&(state.variedad==="Todas"||c.variedad===state.variedad));
  const porLote={};cs.forEach(c=>(porLote[c.lote]??=[]).push(c));
  Object.values(porLote).forEach(a=>{a.sort((x,y)=>x.inicio<y.inicio?-1:1);a.forEach((c,i)=>{c.nCiclo=i+1;c.m=cicloMetricas(c)})});
  const tieneDatos=c=>c.m.U+c.m.X>0;
  const lotes=Object.entries(porLote).filter(([l,a])=>a.some(c=>!c.active&&c.fin&&tieneDatos(c)))
    .map(([l,a])=>({l,a,cerr:a.filter(c=>!c.active&&c.fin&&tieneDatos(c)).length,ult:a.filter(c=>c.fin).map(c=>c.fin).sort().at(-1)}))
    .sort((x,y)=>{const nx=parseInt(lotNum(x.l))||9999,ny=parseInt(lotNum(y.l))||9999;return nx-ny||x.l.localeCompare(y.l)});
  const sinDatos=cs.filter(c=>!c.active&&c.fin&&!tieneDatos(c));
  let h="";
  if(!lotes.length){
    h+=`<p class="ok">Todavía no hay lotes con un ciclo cerrado y su flor registrada en sala en ${esc(state.finca)}. Cuando un lote cierre su ciclo, aparece aquí para compararlo.</p>`;
  }else{
    if(!state.cy.lote||!lotes.some(x=>x.l===state.cy.lote))state.cy.lote=lotes.slice().sort((a,b)=>a.ult<b.ult?1:-1)[0].l;
    h+=`<div class="cy-pick" role="group" aria-label="Lote">${lotes.map(x=>`<button data-l="${esc(x.l)}" aria-pressed="${x.l===state.cy.lote}"><b>${esc(lotNum(x.l))}</b><small>${x.cerr} ciclo${x.cerr>1?"s":""}</small></button>`).join("")}</div>`;
    const L=lotes.find(x=>x.l===state.cy.lote);
    // columnas: ciclos cerrados con datos + ciclo en curso si ya tiene flor
    const cols=L.a.filter(c=>tieneDatos(c)&&(c.fin||c.active));
    const cerr=cols.filter(c=>!c.active);const cur=cols.find(c=>c.active);
    const A=cerr.at(-2),B=cerr.at(-1);
    let titular;
    if(A&&B){const d=(B.m.U-A.m.U)/(A.m.U||1);titular=`El ciclo ${B.nCiclo} dio <b>${num(B.m.U)}</b> tallos útiles, ${Math.round(d*100)===0?"lo mismo que":`<b>${Math.abs(Math.round(d*100))}% ${d>0?"más":"menos"}</b> que`} el ciclo ${A.nCiclo} (${num(A.m.U)}).`}
    else titular=`El ciclo ${B.nCiclo} dio <b>${num(B.m.U)}</b> tallos útiles. La comparación aparece cuando cierre el siguiente ciclo.`;
    const gs=ordenGrados(Object.assign({},...cols.map(c=>c.m.tipos)));const gc={};gs.forEach((g,i)=>gc[g]=SERIES_COL[i%SERIES_COL.length]);
    const mx=Math.max(...cols.map(c=>c.m.U),1);
    const lab=c=>c.active?`Ciclo ${c.nCiclo}<small>en curso, sem. ${c.weeks}</small>`:`Ciclo ${c.nCiclo}<small>${fmtS(c.inicio)} ${D(c.inicio).getFullYear()} a<br>${fmtS(c.fin)} ${D(c.fin).getFullYear()}</small>`;
    h+=`<div class="panel dp-panel"><h2 style="font:600 30px/1.1 var(--serif)">${esc(L.l)}<span style="font:500 14px var(--body);color:var(--muted);margin-left:10px">${esc(L.a.at(-1).variedad||"")}, ${esc(state.finca)}</span></h2>
      <p class="cy-tit">${titular}</p>
      <div class="cy-key">${gs.map(g=>`<span><i style="background:${gc[g]}"></i>${esc(g)}</span>`).join("")}</div>
      <div class="cy-bars">${cols.map(c=>`<div class="cy-col${c.active?" cur":""}"><span class="tot">${num(c.m.U)}</span><div class="stk">${gs.slice().reverse().filter(g=>c.m.tipos[g]).map(g=>`<i title="${esc(g)} ${num(c.m.tipos[g])}" style="height:${c.m.tipos[g]/mx*100}%;background:${gc[g]}"></i>`).join("")}</div><span class="lb">${lab(c)}</span></div>`).join("")}</div>`;
    // tabla comparativa
    const f=(v,d=0)=>v==null?"—":num(+v.toFixed(d));const pc=v=>v==null?"—":pct(v);
    const dlt=(x,y,inv,isP)=>{if(x==null||y==null||x===y)return "";if(!isP&&x===0)return `<em style="color:${inv?"#FFB4B4":"#BDEBD0"}">nuevo</em>`;if(!isP&&y===0)return `<em style="color:${inv?"#BDEBD0":"#FFB4B4"}">no hubo</em>`;const d=isP?Math.round((y-x)*100):Math.round((y-x)/(x||1)*100);if(!d)return "";const good=inv?y<x:y>x;return `<em style="color:${good?"#BDEBD0":"#FFB4B4"}">${d>0?"+":""}${d}${isP?" pts":"%"}</em>`};
    const row=(name,get,fm,opt={})=>`<tr${opt.cls?` class="${opt.cls}"`:""}><td>${name}</td>${cols.map((c,i)=>{const v=get(c);const p=i>0&&!c.active?get(cols[i-1]):null;return `<td>${fm(v)}${i>0&&!c.active&&opt.cmp!==false?dlt(p,v,opt.inv,opt.isP):""}</td>`}).join("")}</tr>`;
    h+=`<div class="scroll" style="margin-top:18px"><table class="cy-t"><thead><tr><th></th>${cols.map(c=>`<th>Ciclo ${c.nCiclo}${c.active?"<small>en curso</small>":""}</th>`).join("")}</tr></thead><tbody>
      ${row("<b>Tallos útiles</b>",c=>c.m.U,v=>`<b>${f(v)}</b>`,{cls:"main"})}
      ${gs.map(g=>row(`<span style="padding-left:10px"><i class="sw" style="background:${gc[g]}"></i>${esc(g)}</span>`,c=>c.m.tipos[g]||0,v=>f(v))).join("")}
      ${row("<b>Tallos descartados</b>",c=>c.m.X,v=>`<b>${f(v)}</b>`,{inv:true,cls:"sep"})}
      ${row("% de lo cosechado",c=>c.m.desc,pc,{inv:true,isP:true})}
      ${(()=>{const ms=Object.keys(Object.assign({},...cols.map(c=>c.m.mot))).sort((a,b)=>cols.reduce((s,c)=>s+(c.m.mot[b]||0),0)-cols.reduce((s,c)=>s+(c.m.mot[a]||0),0));
        return ms.map(mo=>`<tr><td><span style="padding-left:10px">${esc(mo)}</span></td>${cols.map((c,i)=>{const v=c.m.mot[mo]||0;const pr=c.m.X?v/c.m.X:null;const prev=i>0&&!c.active?cols[i-1]:null;
          return `<td>${f(v)}<small class="pp">${pr!=null&&v?pct(pr):""}</small>${prev?dlt(prev.m.mot[mo]||0,v,true):""}</td>`}).join("")}</tr>`).join("")})()}
      ${row("Semanas",c=>c.weeks,v=>f(v),{cmp:false,cls:"sep"})}
      ${row("Camas",c=>c.camas,v=>f(v),{cmp:false})}
      ${row("Tallos por cama",c=>c.m.cama,v=>f(v))}
      ${row("Incidencia promedio",c=>c.m.inc,pc,{inv:true,isP:true})}
      ${row("Abonadas",c=>c.m.ab,v=>f(v),{cmp:false})}
      ${row("Fumigaciones",c=>c.m.fu,v=>f(v),{cmp:false})}
      </tbody></table></div>
      <p class="note" style="font-size:12px">Cada cambio se compara con el ciclo anterior. El porcentaje junto a cada motivo es su parte del total descartado en ese ciclo.${cur?" El ciclo en curso todavía está produciendo, así que no se compara.":""}</p></div>`;
  }
  if(sinDatos.length)h+=`<p class="note" style="color:var(--onpage-muted);font-size:12.5px">Ciclos cerrados antes de registrar ingresos a sala, sin flor para comparar: ${sinDatos.map(c=>`${esc(c.lote)}, ciclo ${c.nCiclo} (cerró ${fmtS(c.fin)})`).join("; ")}.</p>`;
  body.innerHTML=h;
  body.querySelectorAll(".cy-pick button").forEach(b=>b.onclick=()=>{state.cy.lote=b.dataset.l;renderCiclos()});
}

  const fs=document.getElementById("finca");fs.innerHTML=fincas.map(f=>`<option ${f===state.finca?"selected":""}>${esc(f)}</option>`).join("");
  fs.hidden=fincas.length<2;fs.onchange=()=>{state.finca=fs.value;state.variedad="Todas";try{const u=new URL(location.href);u.searchParams.set("finca",fs.value);history.replaceState(null,"",u)}catch(e){}controls();render()};
  const vars=["Todas",...new Set(M.cycles.filter(c=>c.finca===state.finca).map(c=>c.variedad))];
  const vs=document.getElementById("varSeg");vs.hidden=vars.length<3;
  vs.innerHTML=vars.map(v=>`<button aria-pressed="${v===state.variedad}">${esc(v)}</button>`).join("");
  vs.querySelectorAll("button").forEach(b=>b.onclick=()=>{state.variedad=b.textContent;controls();render()});
  document.querySelectorAll("#sortSeg button").forEach(b=>b.onclick=()=>{state.sort=b.dataset.s;document.querySelectorAll("#sortSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
}

/* Unifica los nombres de finca: "Flor de agua 3", "flor de Agua 3 " y "Flor de Agua 3" son la misma finca */
function unificarFincas(raw){
  const k=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
  const canon={};(raw.lotes||[]).forEach(r=>{if(r.finca&&!canon[k(r.finca)])canon[k(r.finca)]=r.finca.trim()});
  Object.values(raw).forEach(arr=>{if(Array.isArray(arr))arr.forEach(r=>{
    if(Array.isArray(r)){if(r[2]){r[2]=canon[k(r[2])]??(canon[k(r[2])]=String(r[2]).trim())}}
    else if(r&&r.finca){r.finca=canon[k(r.finca)]??(canon[k(r.finca)]=String(r.finca).trim())}})});
  return raw;
}

async function init(){
  RAW=SNAPSHOT;DATA_AT=SNAPSHOT_DATE?fmt(SNAPSHOT_DATE):"";
  if(!SOURCE_URL&&!RAW){document.getElementById("global").innerHTML=`<h2>Falta configurar el enlace de datos</h2><p class="sub" style="margin-top:8px">Pega la URL de Apps Script en SOURCE_URL, dentro de index.html.</p>`;return}
  if(SOURCE_URL){
    document.getElementById("global").innerHTML=`<p class="sub">Cargando la información más reciente…</p>`;
    try{const r=await fetch(SOURCE_URL,{cache:"no-store"});if(!r.ok)throw new Error(r.status);RAW=await r.json();if(RAW.error)throw new Error(RAW.error);
      const u=RAW.actualizado?new Date(RAW.actualizado):new Date();DATA_AT=u.getDate()+" "+MES[u.getMonth()]+", "+u.toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"});}
    catch(e){if(!RAW){document.getElementById("global").innerHTML=`<h2>No se pudo cargar la información</h2><p class="sub" style="margin-top:8px">Revisa la conexión a internet y vuelve a abrir el tablero. Si el problema sigue, la hoja de cálculo o el enlace de Apps Script cambió (${esc(e.message)}).</p>`;return}}
  }
  unificarFincas(RAW);M=build(RAW);controls();render();{const vq=new URLSearchParams(location.search).get("vista");setView(["semanas","despachos","ciclos"].includes(vq)?vq:"resumen");}
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",render);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&SOURCE_URL&&Date.now()-loadedAt>10*60e3)location.reload()});
}
const loadedAt=Date.now();
init();
</script>
