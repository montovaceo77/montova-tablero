<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Montova">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Montova · Tablero de cultivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FCFFFF; --onpage:#173428; --onpage-muted:#5A7368; --onpage-line:#C5D6CD; --onpage-soft:#EAF3EE;
  --bg:#FCFFFF; --surface:#457763; --ink:#FFFFFF; --muted:#DCEBE3; --line:#5E8C79; --soft:#3A6655;
  --blue:#E8C28F; --leaf:#7FB39A; --gold:#E8C28F; --focus:#457763; --shadow:0 2px 6px rgba(23,52,40,.10),0 12px 28px rgba(23,52,40,.12);
  --display:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --serif:"Cormorant Garamond","Cormorant",Georgia,serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0F2419; --onpage:#EAF5EF; --onpage-muted:#9DB8AB; --onpage-line:#2E5243; --onpage-soft:#1B3A2C;
  --bg:#0F2419; --surface:#1B3A2C; --ink:#EAF5EF; --muted:#9DB8AB; --line:#2E5243; --soft:#244536; --focus:#8CC2A8; --shadow:none;}}
:root[data-theme="dark"]{--page:#0F2419; --onpage:#EAF5EF; --onpage-muted:#9DB8AB; --onpage-line:#2E5243; --onpage-soft:#1B3A2C;
  --bg:#0F2419; --surface:#1B3A2C; --ink:#EAF5EF; --muted:#9DB8AB; --line:#2E5243; --soft:#244536; --focus:#8CC2A8; --shadow:none;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.brand{font:600 26px/1 var(--serif);letter-spacing:.22em;color:var(--onpage)}
.brand small{display:block;font:500 13px/1.4 var(--body);color:var(--onpage-muted);margin-top:6px;letter-spacing:0}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--onpage-soft);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--onpage-muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#173428}
select{font:600 13px var(--body);color:var(--onpage);background:var(--onpage-soft);border:1px solid var(--onpage-line);cursor:pointer;border-radius:999px;padding:8px 12px}

/* Resumen */
.summary{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-bottom:18px}
.panel{background:var(--surface);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.headline{font:500 clamp(24px,3.4vw,38px)/1.15 var(--display);letter-spacing:-.02em;margin:4px 0 14px;max-width:22ch}
.headline b{font-weight:800}
.sub{color:var(--muted);font-size:14px;margin:0}
.meter{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;margin:18px 0 8px;display:flex}
.meter i{display:block;height:100%}
.meter-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.fact b{display:block;font:700 22px/1.1 var(--display)}
.fact span{font-size:12px;color:var(--muted)}
h2{font:700 17px/1.2 var(--display);margin:0 0 4px;letter-spacing:-.01em}
.panel p.hint{margin:0 0 14px;color:var(--muted);font-size:13px}
.pests{display:flex;flex-direction:column;gap:6px}
.pest{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;border:0;background:transparent;padding:5px 6px;margin:0 -6px;border-radius:10px;cursor:pointer;text-align:left}
.pest:hover{background:var(--soft)}
.pest[aria-pressed="true"]{background:var(--soft)}
.pest .nm{font-size:14px;font-weight:500}
.pest .bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.pest[aria-pressed="true"] .bar{background:var(--surface)}
.pest .bar i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.pest .v{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.more{border:0;background:none;color:var(--blue);font-size:13px;font-weight:600;padding:6px 0 0;cursor:pointer}

.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}
.insight{background:var(--surface);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);border-left:4px solid var(--c,var(--blue))}
.insight h3{font:600 15px/1.3 var(--body);margin:0 0 6px}
.insight p{margin:0;color:var(--muted);font-size:13.5px}

.traps[hidden]{display:none}
.traps{margin:-10px 0 28px;display:grid;grid-template-columns:1fr 1.2fr 1.3fr;gap:26px;align-items:start}
.traps .lbl{font-size:13px;color:var(--muted);margin:0 0 4px}
.traps .big{font-size:40px}
.trow{display:grid;grid-template-columns:70px 1fr 44px;gap:10px;align-items:center;font-size:13.5px;margin:7px 0}
.trow .bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.trow .bar i{display:block;height:100%;border-radius:999px;background:var(--gold)}
.trow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.wk{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:4px}
.wkc{flex:0 1 52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wkb{width:100%;max-width:44px;border-radius:6px 6px 3px 3px;min-height:3px;flex:none}
.wkv{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.wkl{font-size:11.5px;color:var(--muted);white-space:nowrap}
.delta{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px}
@media (max-width:860px){.traps{grid-template-columns:1fr;gap:18px}}

/* Pestañas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--onpage-line);margin:-6px 0 22px}
.tabs button{border:0;background:none;padding:10px 4px;margin-right:18px;font:600 15px var(--body);color:var(--onpage-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--onpage);border-bottom-color:var(--focus)}

/* Semana a semana */
.wk-head{margin-bottom:18px}
.wk-head .t{font:600 34px/1.1 var(--serif);color:var(--onpage);margin:0 0 4px}
.wk-head p.s{margin:0 0 16px;color:var(--onpage-muted);font-size:14px}
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.alert{background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border-left:5px solid var(--c)}
.alert b{display:block;font-size:14.5px;margin-bottom:3px}
.alert span{font-size:13px;color:var(--muted)}
.ok{background:var(--onpage-soft);color:var(--onpage);border-radius:16px;padding:14px 16px;font-weight:600}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart h3{font:600 15px var(--body);margin:0 0 2px}
.chart .cap{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.chart .now{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.chart .now b{font:800 26px/1 var(--display)}
.chart svg{display:block;width:100%;height:auto}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px}
.lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chg{width:100%;border-collapse:collapse;font-size:14px}
.chg th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:0 8px 8px 0}
.chg td{padding:9px 8px 9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.chg .d{font-weight:700}
.scroll{overflow-x:auto}
@media (max-width:860px){.charts{grid-template-columns:1fr}}

/* Despachos */
.dp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.dp-head .t{font:600 34px/1.1 var(--serif);color:var(--onpage);margin:0 0 4px}
.dp-head .s{margin:0;color:var(--onpage-muted);font-size:14px}
.dp-filter{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.dp-dates{display:flex;gap:8px;flex-wrap:wrap}
.dp-dates label{font-size:12.5px;color:var(--onpage-muted);display:flex;align-items:center;gap:6px}
.dp-dates input{font:500 13px var(--body);color:var(--onpage);background:var(--onpage-soft);border:1px solid var(--onpage-line);border-radius:999px;padding:6px 10px}
.dp-top{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;margin-bottom:16px}
.dp-top .big{font-size:44px}
.dp-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.dp-facts b{display:block;font:700 20px/1.1 var(--display)}
.dp-facts span{font-size:12px;color:var(--muted)}
.drow{display:grid;grid-template-columns:minmax(110px,150px) 1fr 76px;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:6px;margin:0 -6px;border-radius:10px;cursor:pointer;text-align:left;color:inherit;font-size:14px}
.drow:hover,.drow[aria-pressed="true"]{background:var(--soft)}
.drow .bar{height:9px;border-radius:999px;background:var(--soft);overflow:hidden}
.drow[aria-pressed="true"] .bar{background:var(--surface)}
.drow .bar i{display:block;height:100%;border-radius:999px}
.drow .v{text-align:right;font-variant-numeric:tabular-nums}
.drow .v small{display:block;color:var(--muted);font-size:11.5px}
.dp-panel{margin-bottom:16px}
.chg td.r,.chg th.r{text-align:right}
.chg tfoot td{font-weight:700;border-top:2px solid var(--line)}
.bal-d summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bal-d summary::-webkit-details-marker{display:none}
.bal-d summary::after{content:"Ver";margin-left:auto;font-size:13px;font-weight:600;color:var(--gold)}
.bal-d[open] summary::after{content:"Ocultar"}
.bal-d .bt{font:600 17px/1.2 var(--display)}
.bal-d .bs{font-size:13px;color:var(--muted)}
.bal-d[open] summary{margin-bottom:6px}
.bal{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.bal div{background:var(--soft);border-radius:12px;padding:10px 12px}
.bal span{display:block;font-size:12px;color:var(--muted)}
.bal b{font:700 22px/1.2 var(--display);font-variant-numeric:tabular-nums}
.bal .hl{box-shadow:inset 0 0 0 2px var(--c)}
.balmsg{margin:12px 0 0;font-size:14px;border-left:4px solid var(--c);padding:4px 0 4px 12px}
.chg tr.bd td{border-top:0;padding-top:0;font-size:12px;color:var(--muted)}
.chg tr.bd span{display:block}
.st{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--c);white-space:nowrap}
@media (max-width:520px){.est{display:none}}
@media (max-width:860px){.bal{grid-template-columns:repeat(2,1fr)}.bal .hl{grid-column:1/-1}}
.dl-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dl-btn{border:0;border-radius:999px;padding:9px 16px;font:600 13.5px var(--body);background:var(--gold);color:#173428;cursor:pointer}
.dl-btn:disabled{opacity:.6;cursor:wait}
.dl-t td{padding:8px 8px 8px 0}
.dl-r:hover td{background:var(--soft)}
.dl-d td{border-top:0;padding-top:0}
.dsp{border-top:1px solid var(--line);padding:12px 0}
.dsp:first-of-type{border-top:0;padding-top:4px}
.dsp .row1{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.dsp .row1 b{font-size:15px}
.dsp .row1 .q{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.dsp .meta{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.dsp .nov{font-size:12.5px;color:var(--muted);margin:6px 0 0;font-style:italic}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs button{white-space:nowrap}
#dpPreset{flex-wrap:wrap;border-radius:18px}
#dpPreset button{white-space:nowrap}
@media (max-width:520px){.tabs button{margin-right:10px;font-size:13.5px}}
@media (max-width:860px){.dp-top{grid-template-columns:1fr}.dp-filter{align-items:flex-start}}
@media (max-width:520px){.dp-top .big{font-size:36px}}

/* Ciclos */
.cy-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-bottom:16px}
.cy-pick button{border:1.5px solid var(--onpage-line);background:var(--onpage-soft);color:var(--onpage);border-radius:12px;padding:8px 6px;cursor:pointer;text-align:center}
.cy-pick button b{display:block;font:700 18px/1.1 var(--display)}
.cy-pick button small{font-size:11px;color:var(--onpage-muted)}
.cy-pick button[aria-pressed="true"]{background:var(--surface);border-color:var(--surface);color:var(--ink)}
.cy-pick button[aria-pressed="true"] small{color:var(--muted)}
.cy-tit{font-size:16px;margin:8px 0 14px;max-width:60ch}
.cy-bars{display:flex;align-items:flex-end;gap:clamp(14px,4vw,40px);height:240px;padding:20px 4px 0;border-bottom:1px solid var(--line)}
.cy-col{flex:0 1 120px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.cy-col .tot{font:700 15px var(--display);margin-bottom:4px;font-variant-numeric:tabular-nums}
.cy-col .stk{width:100%;max-width:90px;height:calc(100% - 26px);display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px 8px 0 0;overflow:hidden}
.cy-col .stk i{display:block;width:100%}
.cy-col.cur .stk{opacity:.55}
.cy-col .lb{position:absolute;top:100%;margin-top:6px;font-size:13px;font-weight:600;text-align:center;white-space:nowrap;line-height:1.3}
.cy-col .lb small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.cy-bars{margin-bottom:60px}
@media (max-width:520px){.cy-col .lb{font-size:12px}.cy-col .lb small{font-size:10px}.cy-pick{grid-template-columns:repeat(auto-fill,minmax(60px,1fr))}.cy-t{font-size:13px}}
.cy-t{width:100%;border-collapse:collapse;font-size:14px}
.cy-t th{text-align:right;font-size:12.5px;font-weight:600;color:var(--muted);padding:0 0 8px 14px;white-space:nowrap}
.cy-t th small{display:block;font-weight:400}
.cy-t td{text-align:right;padding:8px 0 8px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.cy-t th:first-child,.cy-t td:first-child{text-align:left;padding-left:0}
.cy-t em{font-style:normal;font-size:12px;margin-left:6px}
.cy-t tr.main td{border-top:0}
.cy-t tr.sep td{border-top:2px solid var(--line)}
.cy-t small.pp{color:var(--muted);font-size:11.5px;margin-left:5px}
.cy-t .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.cy-top{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.cy-top .panel span{display:block;font-size:13px;color:var(--muted)}
.cy-top .panel b{display:block;font:800 34px/1.1 var(--display);margin:4px 0 2px}
.cy-top .panel small{font-size:12.5px;color:var(--muted)}
.db{display:grid;grid-template-columns:minmax(80px,120px) 1fr 84px;gap:12px;align-items:center;width:100%;border:0;background:transparent;color:inherit;padding:10px 6px;margin:0 -6px;border-radius:12px;cursor:pointer;text-align:left;font-size:14px}
.db:hover,.db[aria-expanded="true"]{background:var(--soft)}
.db .tr{position:relative;height:22px}
.db .tr::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line)}
.db .ln{position:absolute;top:9px;height:4px;border-radius:2px}
.db .dt{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;margin-left:-7px}
.db .dv{position:absolute;top:-14px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.db .ch{justify-self:end;font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.cy-key{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:2px 0 8px;flex-wrap:wrap}
.cy-key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.cmp{margin:4px 0 12px;padding:4px 14px 10px;background:var(--soft);border-radius:12px}
.cmp table{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th{text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:8px 0 6px 10px}
.cmp th:first-child,.cmp td:first-child{text-align:left;padding-left:0}
.cmp td{text-align:right;padding:6px 0 6px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.cmp td.u{font-weight:700}
.rk{display:grid;grid-template-columns:minmax(120px,170px) 1fr 70px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.rk .bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.rk .bar i{display:block;height:100%;border-radius:999px}
.rk .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rk small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
@media (max-width:860px){.cy-top{gap:8px}.cy-top .panel{padding:14px}.cy-top .panel b{font-size:26px}}
@media (max-width:520px){.cy-top .panel span{font-size:11.5px}.cy-top .panel small{display:none}}
@media (max-width:520px){.db{grid-template-columns:64px 1fr 70px;gap:8px}.rk{grid-template-columns:110px 1fr 56px}}

/* Mapa */
.map-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.map-head .t{font:600 34px/1.1 var(--serif);letter-spacing:.01em;margin:0;color:var(--onpage)}
.map-head p{margin:4px 0 0;color:var(--onpage-muted);font-size:14px}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--onpage-muted)}
.legend .ramp{width:120px;height:8px;border-radius:999px}
.lens{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;box-shadow:var(--shadow)}
.lens[hidden]{display:none}
.lens button{border:0;background:var(--soft);border-radius:999px;padding:3px 9px;cursor:pointer;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{position:relative;border:0;border-radius:14px;padding:12px 12px 14px;min-height:108px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s ease}
.tile:hover{transform:translateY(-2px)}
.tile .n{font:700 26px/1 var(--display);letter-spacing:-.02em}
.tile .n small{font:500 11px var(--body);opacity:.75;margin-left:4px;letter-spacing:0}
.tile .p{font:600 15px/1 var(--body);font-variant-numeric:tabular-nums}
.tile .w{font-size:11.5px;opacity:.8}
.tile .prog{position:absolute;left:12px;right:12px;bottom:7px;height:3px;border-radius:9px;background:rgba(255,255,255,.35)}
.tile .prog i{display:block;height:100%;border-radius:9px;background:currentColor;opacity:.7}
.tile.none{background:transparent;border:1.5px dashed var(--onpage-line);color:var(--onpage-muted)}

.group-label{grid-column:1/-1;font-size:13px;color:var(--focus);font-weight:600;margin:10px 0 0}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--bg);z-index:11;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 30px)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim,.tile{transition:none}}
.d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.d-top h2{font:600 38px/1 var(--serif);letter-spacing:.01em;color:var(--onpage)}
.d-top .chip{background:var(--onpage-soft);color:var(--onpage)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink);margin:2px 4px 2px 0}
.close{border:0;background:var(--surface);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:var(--shadow);flex:none}
.cycle{margin:6px 0 2px}
.cycle .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.cycle .track{height:10px;border-radius:999px;background:var(--soft);margin:6px 0;overflow:hidden}
.cycle .track i{display:block;height:100%;background:var(--leaf);border-radius:999px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card.wide{grid-column:1/-1}
.card h4{font:600 13px/1.2 var(--body);color:var(--muted);margin:0 0 8px}
.big{font:700 28px/1 var(--display);letter-spacing:-.02em}
.card .note{font-size:13px;color:var(--muted);margin:6px 0 0}
.steps{display:flex;gap:6px;margin-top:6px}
.steps span{flex:1;height:30px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.steps span.done{background:var(--leaf);color:#173428}
.beds{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.bed{border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 3px;border-radius:6px;background:var(--soft);min-width:26px}
.bed small{font-size:9.5px;color:var(--muted);line-height:1}
.bed .dots{display:flex;gap:2px}
.bed .dots i{width:6px;height:6px;border-radius:50%}
.key{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.key i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.empty{font-size:13.5px;color:var(--muted);background:var(--soft);border-radius:12px;padding:12px 14px;margin:0}
.list{margin:0;padding:0;list-style:none;font-size:13.5px}
.list li{padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0;padding-top:0}
.list .dt{color:var(--muted);font-size:12px;display:block}
svg text{font-family:var(--body)}
.prev{font-size:13px;color:var(--onpage-muted);margin:14px 0 0}
details.dq{margin-top:34px;font-size:13px;color:var(--onpage-muted)}
details.dq summary{cursor:pointer;font-weight:600}
details.dq ul{margin:8px 0 0;padding-left:18px}

@media (max-width:860px){
  .summary{grid-template-columns:1fr}
  .insights{grid-template-columns:1fr}
  .facts{grid-template-columns:repeat(2,1fr)}
}

  .grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .tile{min-height:96px;padding:10px 9px 13px}
  .tile .n{font-size:22px}
  .dgrid{grid-template-columns:1fr}
  .drawer{padding-left:14px;padding-right:14px}
}

<body>
<div class="wrap">

      <select id="finca" aria-label="Finca"></select>

  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-v="resumen" aria-selected="true">Resumen</button>
    <button role="tab" data-v="semanas" aria-selected="false">Semana a semana</button>
    <button role="tab" data-v="despachos" aria-selected="false">Despachos</button>

  </nav>

  <div id="viewResumen">
  <section class="summary">
    <div class="panel" id="global"></div>
    <div class="panel">
      <h2>Qué se está encontrando</h2>
      <p class="hint">Porcentaje de puntos inspeccionados con cada problema. Toca uno para verlo en el mapa de lotes.</p>
      <div class="pests" id="pests"></div>
    </div>
  </section>

  <section class="insights" id="insights"></section>

  <section class="panel traps" id="traps" hidden></section>

  <section>
    <div class="map-head">
      <div>
        <h2 class="t">Lotes</h2>
        <p id="mapSub"></p>
      </div>
      <div class="controls">
        <span class="lens" id="lens" hidden></span>
        <div class="seg" id="sortSeg" role="group" aria-label="Ordenar">
          <button data-s="ciclo" aria-pressed="true">Por ciclo</button>
          <button data-s="inc" aria-pressed="false">Por incidencia</button>
        </div>
      </div>
    </div>
    <div class="legend" style="margin-bottom:12px"><span>0%</span><span class="ramp" id="ramp"></span><span>100% de puntos afectados</span></div>
    <div class="grid" id="grid"></div>
  </section>

  </div>

  <div id="viewSemanas" hidden>
    <section class="wk-head" id="wkHead"></section>
    <section class="charts" id="charts"></section>
    <section class="panel" id="lotChanges"></section>
  </div>

  <div id="viewDespachos" hidden>
    <section class="dp-head">
      <div><h2 class="t">Despachos</h2><p class="s" id="dpRango"></p></div>
      <div class="dp-filter">
        <div class="seg" id="dpPreset" role="group" aria-label="Rango de fechas">
          <button data-p="sem">Esta semana</button><button data-p="4s">Últimas 4 semanas</button><button data-p="mes">Este mes</button><button data-p="todo">Todo</button>
        </div>
        <div class="dp-dates"><label>Desde <input type="date" id="dpDesde"></label><label>Hasta <input type="date" id="dpHasta"></label></div>
      </div>
    </section>
    <div id="dpBody"></div>
  </div>

  <div id="viewCiclos" hidden>
    <section class="dp-head"><div><h2 class="t">Ciclos</h2><p class="s" id="cySub"></p></div></section>
    <div id="cyBody"></div>

  <details class="dq" id="dq"></details>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle"></aside>

<script>
/* Para conectar en vivo (fuera de claude.ai, p. ej. GitHub Pages): pon aquí la URL del doGet de Apps Script
   que devuelva este mismo formato JSON. Si queda vacía, se usan los datos incluidos. */
const SOURCE_URL = "https://script.google.com/macros/s/AKfycbzSwcaE7Ub0WUaKTNZZ8ZGf-tgdpu6wNEzCXjnzf9R4MX4jhHVCTgrhpjsI_A-S0sAT/exec";
/* Límites de alerta (puntos porcentuales o %). Ajustables. */
const ALERTAS = { cultivo: 5, lote: 15, plaga: 5, trampas: 20, descarte: 5 };
const LECTURAS_SEMANA = 2; // trampas: lunes y miércoles
const SNAPSHOT = null;
const SNAPSHOT_DATE = "";

const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const D=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=s=>{if(!s)return "—";const d=D(s);return d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear()};
const fmtS=s=>{const d=D(s);return d.getDate()+" "+MES[d.getMonth()]};
const pct=v=>Math.round(v*100)+"%";
const num=v=>v==null?"—":v.toLocaleString("es-CO");
const days=(a,b)=>Math.round((D(b)-D(a))/864e5);
const todayStr=(()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")})();
function isoWeek(s){const d=D(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return {y:t.getUTCFullYear(),w:Math.ceil(((t-y)/864e5+1)/7)}}
const wkKey=s=>{const k=isoWeek(s);return k.y+"-"+String(k.w).padStart(2,"0")};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lotNum=l=>l.replace(/^lote\s*/i,"");

let DATA_AT="", RAW, M, state={finca:null,variedad:"Todas",sort:"ciclo",lens:null};

function parsePoint(v){
  if(!v||/sano/i.test(v))return [];
  return [...new Set(v.split(",").map(x=>x.replace(/\(.*?\)/g,"").trim()).filter(Boolean))];
}

function build(raw){
  const cycles=raw.lotes.map((l,i)=>({...l,id:i,mon:[],abon:[],fum:[],sala:[],prep:null}));
  const byLot={};
  cycles.forEach(c=>{(byLot[c.finca+"|"+c.lote]??=[]).push(c)});
  Object.values(byLot).forEach(a=>a.sort((x,y)=>x.inicio<y.inicio?-1:1));
  const orphans={};
  function find(finca,lote,fecha){
    const a=byLot[finca+"|"+lote];if(!a)return null;
    let best=null;for(const c of a){if(c.inicio<=fecha)best=c}
    return best||a[0];
  }
  const orphan=(what,finca,lote)=>{const k=finca+"|"+lote;(orphans[k]??={finca,lote,what:new Set()}).what.add(what)};
  raw.prep.forEach(p=>{const c=cycles.find(c=>c.finca===p.finca&&c.lote===p.lote&&c.inicio===p.inicio)||find(p.finca,p.lote,p.inicio||"9999");if(c)c.prep=p});
  // monitoreo: una fila por cama y fecha (la última registrada)
  const last={};let repeated=0;const repList=[];
  raw.monitoreo.forEach(r=>{const k=r[1]+"|"+r[2]+"|"+r[3]+"|"+r[4];if(last[k]){repeated++;repList.push({fecha:r[1],finca:r[2],lote:r[3],cama:r[4]});if(Number(r[0])>Number(last[k][0]))last[k]=r}else last[k]=r});
  Object.values(last).forEach(r=>{
    const [id,fecha,finca,lote,cama,p1,p2,p3]=r;const c=find(finca,lote,fecha);
    const pts=[p1,p2,p3].map(parsePoint);
    if(c)c.mon.push({fecha,cama,pts});else orphan("monitoreo",finca,lote);
  });
  raw.labores.forEach(r=>{const c=find(r.finca,r.lote,r.fecha);if(c&&/abon/i.test(r.labor||""))c.abon.push(r);else if(!c)orphan("abonadas",r.finca,r.lote)});
  raw.fumigacion.forEach(r=>{
    (r.lotes||"").split(",").map(s=>s.trim()).filter(Boolean).forEach(l=>{
      const lote=/^lote/i.test(l)?l:"Lote "+l;const c=find(r.finca,lote,r.fecha);
      const plagas=(r.plagas||"").split(",").map(s=>s.trim()).filter(Boolean);
      if(c)c.fum.push({...r,plagasL:plagas});else orphan("fumigación",r.finca,lote);
    });
  });
  (raw.ingreso||[]).forEach(r0=>{
    const q=+r0.cantidad||0,dn=+r0.descarte,dt=String(r0.descarte??"").trim();
    let util=q,desc=0;
    if(dn>0&&r0.tipo){desc=dn}                               // columna Descarte numérica junto a una variedad
    else if(/^s[ií]/i.test(dt)||r0.motivo||(!r0.tipo&&q)){util=0;desc=q} // fila de descarte (Descarte = "Si")
    const r={...r0,util,desc};
    const c=find(r.finca,r.lote,r.fecha);if(c)c.sala.push(r);else orphan("ingreso a sala",r.finca,r.lote)});
  cycles.forEach(c=>{
    const dates=[...new Set(c.mon.map(m=>m.fecha))].sort();
    c.monDates=dates;
    c.lastMon=dates.at(-1)||null;
    c.cur=c.lastMon?c.mon.filter(m=>m.fecha===c.lastMon):[];
    c.inc=stats(c.cur);
    c.abon.sort((a,b)=>a.fecha<b.fecha?-1:1);c.fum.sort((a,b)=>a.fecha<b.fecha?-1:1);
    const ref=c.fin||todayStr;c.weeks=Math.max(0,Math.floor(days(c.inicio,ref)/7));
    c.active=!/inactiv/i.test(c.estado||"");
  });
  const finished=cycles.filter(c=>!c.active&&c.fin);
  const typical=finished.length?Math.round(finished.reduce((s,c)=>s+c.weeks,0)/finished.length):34;
  const allMonDates=cycles.flatMap(c=>c.monDates);
  return {cycles,orphans:Object.values(orphans),repeated,repList,typical,hasMon:allMonDates.length>0};
}

function stats(rows){
  let points=0,bad=0;const pest={};const beds=new Set();
  rows.forEach(r=>{beds.add(r.cama);r.pts.forEach(p=>{points++;if(p.length)bad++;p.forEach(x=>pest[x]=(pest[x]||0)+1)})});
  return {points,bad,rate:points?bad/points:null,pest,beds:beds.size};
}

/* Color: rampa de verde salvia a baya profunda */
const RAMP_L=["#CFE5D6","#E8DDA4","#EBB184","#D86F74","#9B3358"];
const RAMP_D=["#2D5C47","#6B6433","#8A5536","#94404F","#B8466F"];
function isDark(){const a=document.documentElement.getAttribute("data-theme");if(a)return a==="dark";return matchMedia("(prefers-color-scheme: dark)").matches}
function hex(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function col(v){
  const R=isDark()?RAMP_D:RAMP_L;const x=Math.max(0,Math.min(1,v))*(R.length-1);const i=Math.min(R.length-2,Math.floor(x)),t=x-i;
  const a=hex(R[i]),b=hex(R[i+1]);const c=a.map((v,k)=>Math.round(v+(b[k]-v)*t));
  const lum=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255;
  return {bg:`rgb(${c})`,fg:isDark()?"#F2F4FA":(lum<.55?"#FFFFFF":"#173428")};
}

function visible(){
  return M.cycles.filter(c=>c.finca===state.finca&&(state.variedad==="Todas"||c.variedad===state.variedad));
}

/* Incidencia global de la semana: el último monitoreo de cada lote dentro de esa semana */
function weekly(cs){
  const weeks={};
  cs.forEach(c=>{
    const byW={};c.monDates.forEach(d=>{byW[wkKey(d)]=d});
    Object.entries(byW).forEach(([w,d])=>{(weeks[w]??=[]).push(...c.mon.filter(m=>m.fecha===d).map(m=>({...m,cycle:c})))});
  });
  return Object.keys(weeks).sort().map(w=>({w,rows:weeks[w],s:stats(weeks[w]),lots:new Set(weeks[w].map(r=>r.cycle.id)).size}));
}

function render(){
  const cs=visible();const active=cs.filter(c=>c.active);
  const W=weekly(cs);const cur=W.at(-1);const prev=W.at(-2);
  const wk=cur?isoWeek(cur.rows[0].fecha).w:null;
  document.getElementById("subtitle").textContent=state.finca+(cur?`, semana ${wk}`:"")+`. Datos al ${DATA_AT}`;

  // Panel global
  const g=document.getElementById("global");
  if(!cur){g.innerHTML=`<h2>Estado sanitario del cultivo</h2><p class="empty" style="margin-top:12px">Todavía no hay monitoreos registrados para esta selección.</p>`}
  else{
    const s=cur.s;const c=col(s.rate);
    let trend="";
    if(prev){const d=s.rate-prev.s.rate;trend=` ${d>0?"Sube":"Baja"} ${Math.abs(Math.round(d*100))} puntos frente a la semana anterior.`}
    else trend=" La tendencia semanal aparece a partir del segundo monitoreo.";
    const allSala=cs.flatMap(c=>c.sala);const salaAny=allSala.length>0;const sW=salaAny?allSala.map(r=>wkKey(r.fecha)).sort().at(-1):null;
    const sRows=allSala.filter(r=>wkKey(r.fecha)===sW);const sala=sRows.reduce((x,r)=>x+r.util,0),salaD=sRows.reduce((x,r)=>x+r.desc,0);
    const sWn=sW?+sW.split("-")[1]:null;
    const fumW=cs.reduce((a,c)=>a+c.fum.filter(f=>wkKey(f.fecha)===cur.w).length,0);
    const abW=cs.reduce((a,c)=>a+c.abon.filter(f=>wkKey(f.fecha)===cur.w).length,0);
    g.innerHTML=`<h2>Estado sanitario del cultivo, semana ${wk}</h2>
      <p class="headline"><b>${pct(s.rate)}</b> de los puntos inspeccionados tienen alguna plaga o enfermedad</p>
      <p class="sub">${num(s.points)} puntos en ${num(s.beds?cur.rows.length:0)} camas de ${cur.lots} lotes.${trend}</p>
      <div class="meter" role="img" aria-label="${pct(s.rate)} afectados"><i style="width:${s.rate*100}%;background:${c.bg}"></i></div>
      <div class="meter-legend"><span>Afectados ${num(s.bad)}</span><span>Sanos ${num(s.points-s.bad)}</span></div>
      <div class="facts">
        <div class="fact"><b>${active.length}</b><span>lotes en producción</span></div>
        <div class="fact"><b>${cur.lots} de ${active.length}</b><span>lotes monitoreados</span></div>
        <div class="fact"><b>${fumW} / ${abW}</b><span>fumigaciones / abonadas esta semana</span></div>
        <div class="fact"><b>${salaAny?num(sala):"Sin datos"}</b><span>${salaAny?`tallos a sala, semana ${sWn}${sala+salaD?`. Descarte ${pct(salaD/(sala+salaD))}`:""}`:"tallos a sala"}</span></div>
      </div>`;
  }

  // Plagas
  const P=document.getElementById("pests");
  if(cur){
    const arr=Object.entries(cur.s.pest).sort((a,b)=>b[1]-a[1]);const max=arr[0]?arr[0][1]/cur.s.points:1;
    const show=P.dataset.all?arr:arr.slice(0,5);
    P.innerHTML=show.map(([k,v])=>`<button class="pest" data-p="${esc(k)}" aria-pressed="${state.lens===k}"><span class="nm">${esc(k)}</span><span class="bar"><i style="width:${v/cur.s.points/max*100}%"></i></span><span class="v">${pct(v/cur.s.points)}</span></button>`).join("")+
      (arr.length>5?`<button class="more" id="morePests">${P.dataset.all?"Ver menos":"Ver los "+arr.length+" problemas encontrados"}</button>`:"");
    P.querySelectorAll(".pest").forEach(b=>b.onclick=()=>{state.lens=state.lens===b.dataset.p?null:b.dataset.p;render()});
    const mb=document.getElementById("morePests");if(mb)mb.onclick=()=>{P.dataset.all=P.dataset.all?"":"1";render()};
  }else P.innerHTML=`<p class="empty">Sin monitoreos todavía.</p>`;

  // Hallazgos
  const I=document.getElementById("insights");const ins=[];
  if(cur){
    const lots=active.filter(c=>c.lastMon&&wkKey(c.lastMon)===cur.w).sort((a,b)=>b.inc.rate-a.inc.rate);
    const top=lots.filter(c=>c.inc.rate>=.8);
    if(top.length) ins.push({c:col(.9).bg,h:`${top.length} ${top.length===1?"lote supera":"lotes superan"} el 80% de puntos afectados`,p:`${top.map(c=>lotNum(c.lote)).join(", ")}. Son los primeros para revisar en campo.`});
    const main=Object.entries(cur.s.pest).sort((a,b)=>b[1]-a[1])[0];
    if(main){const inLots=lots.filter(c=>c.inc.pest[main[0]]).length;
      ins.push({c:"var(--blue)",h:`${main[0]} es el problema principal`,p:`Aparece en ${pct(main[1]/cur.s.points)} de los puntos y está presente en ${inLots} de ${lots.length} lotes monitoreados.`})}
    const ref=cur.rows.map(r=>r.fecha).sort().at(-1);
    const noFum=lots.filter(c=>c.inc.rate>=cur.s.rate&&!c.fum.some(f=>days(f.fecha,ref)<=15&&days(f.fecha,ref)>=-7));
    if(noFum.length) ins.push({c:"#C98A2E",h:`${noFum.length} lotes sobre el promedio sin fumigación registrada`,p:`En los últimos 15 días no aparece aplicación en ${noFum.slice(0,8).map(c=>lotNum(c.lote)).join(", ")}${noFum.length>8?" y otros":""}.`});
    else ins.push({c:"var(--leaf)",h:"Los lotes más afectados tienen fumigación reciente",p:"Todos los lotes sobre el promedio registran aplicación en los últimos 15 días."});
    const noMon=active.filter(c=>!c.lastMon||wkKey(c.lastMon)!==cur.w);
    if(ins.length<3&&noMon.length) ins.push({c:"var(--muted)",h:`${noMon.length} lotes sin monitoreo esta semana`,p:noMon.map(c=>lotNum(c.lote)).join(", ")});
  }
  I.innerHTML=ins.slice(0,3).map(x=>`<div class="insight" style="--c:${x.c}"><h3>${esc(x.h)}</h3><p>${esc(x.p)}</p></div>`).join("");

  // Trampas de insectos (por finca y semana)
  renderTraps();

  // Mapa
  const lens=document.getElementById("lens");
  if(state.lens){lens.hidden=false;lens.innerHTML=`Mostrando: ${esc(state.lens)} <button aria-label="Quitar filtro">Quitar</button>`;lens.querySelector("button").onclick=()=>{state.lens=null;render()}}
  else lens.hidden=true;
  document.getElementById("ramp").style.background=`linear-gradient(90deg,${(isDark()?RAMP_D:RAMP_L).join(",")})`;
  const val=c=>{if(!c.inc.points)return null;return state.lens?(c.inc.pest[state.lens]||0)/c.inc.points:c.inc.rate};
  let list=active.slice();
  if(state.sort==="inc")list.sort((a,b)=>(val(b)??-1)-(val(a)??-1));
  else list.sort((a,b)=>a.inicio<b.inicio?-1:1);
  document.getElementById("mapSub").textContent=state.sort==="ciclo"?"Del más avanzado al más reciente en su ciclo. Toca un lote para ver su historia completa.":"De mayor a menor incidencia en su último monitoreo. Toca un lote para ver su historia completa.";
  const tile=c=>{const v=val(c);const w=Math.min(1,c.weeks/M.typical);
    if(v==null)return `<button class="tile none" data-id="${c.id}"><span class="n">${esc(lotNum(c.lote))}</span><span><span class="p" style="font-size:12px">Sin monitoreo</span><br><span class="w">Semana ${c.weeks}</span></span><span class="prog"><i style="width:${w*100}%"></i></span></button>`;
    const k=col(v);return `<button class="tile" data-id="${c.id}" style="background:${k.bg};color:${k.fg}" aria-label="${esc(c.lote)}, ${pct(v)} afectado, semana ${c.weeks}"><span class="n">${esc(lotNum(c.lote))}</span><span><span class="p">${pct(v)}</span><br><span class="w">Semana ${c.weeks}</span></span><span class="prog"><i style="width:${w*100}%"></i></span></button>`};
  const G=document.getElementById("grid");
  if(state.variedad==="Todas"&&new Set(list.map(c=>c.variedad)).size>1&&state.sort==="ciclo"){
    const vs=[...new Set(list.map(c=>c.variedad))];
    G.innerHTML=vs.map(v=>`<div class="group-label">${esc(v)}</div>`+list.filter(c=>c.variedad===v).map(tile).join("")).join("");
  }else G.innerHTML=list.map(tile).join("")||`<p class="empty" style="grid-column:1/-1">No hay lotes activos para esta selección.</p>`;
  G.querySelectorAll(".tile").forEach(b=>b.onclick=()=>openLot(+b.dataset.id,b));

  // Calidad de datos
  const dq=[];const orph=M.orphans.filter(o=>o.finca===state.finca);
  orph.forEach(o=>dq.push(`${o.lote} tiene registros de ${[...o.what].join(" y ")}, pero no está programado en Lotes.`));
  const rep=M.repList.filter(r=>r.finca===state.finca);
  if(rep.length)dq.push(`${rep.length===1?"Una cama aparece":rep.length+" camas aparecen"} dos veces el mismo día en Monitoreo; se usa el último registro: ${rep.map(r=>`${r.lote}, cama ${r.cama}, ${fmt(r.fecha)}`).join("; ")}.`);
  if(!cs.some(c=>c.sala.length))dq.push("Aún no hay registros de ingreso a sala; esa parte del tablero se llena sola cuando empiecen.");
  const dqe=document.getElementById("dq");dqe.hidden=!dq.length;
  renderWeeks();renderDespachos();renderCiclos();
  dqe.innerHTML=`<summary>Notas sobre los datos (${dq.length})</summary><ul>${dq.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
}

/* ---------- Semana a semana ---------- */
const SERIES_COL=["#E8C28F","#FFFFFF","#F4A9A0","#A9CBEF","#C9E59B","#D9B8F0"];
const wkNum=k=>+k.split("-")[1];
function prevKey(k){const [y,w]=k.split("-").map(Number);if(w>1)return y+"-"+String(w-1).padStart(2,"0");const d=new Date(Date.UTC(y-1,11,28));const s=d.toISOString().slice(0,10);return wkKey(s)}

function weeklySeries(cs){
  const W=weekly(cs);const out={};
  W.forEach(w=>{out[w.w]={inc:w.s.rate,pest:{},points:w.s.points,lots:w.lots};Object.entries(w.s.pest).forEach(([p,v])=>out[w.w].pest[p]=v/w.s.points)});
  const tr=(RAW.trampas||[]).filter(r=>r.finca===state.finca&&r.fecha);const T={};
  tr.forEach(r=>{const k=wkKey(r.fecha);(T[k]??={s:0,n:0});T[k].s+=r.t.reduce((a,b)=>a+(+b||0),0);T[k].n++});
  Object.entries(T).forEach(([k,v])=>{(out[k]??={pest:{}}).trap=v.s/v.n;out[k].trapN=v.n});
  const S={};cs.forEach(c=>c.sala.forEach(r=>{const k=wkKey(r.fecha);(S[k]??={u:0,d:0});S[k].u+=r.util;S[k].d+=r.desc}));
  Object.entries(S).forEach(([k,v])=>{if(v.u+v.d){(out[k]??={pest:{}}).desc=v.d/(v.u+v.d);out[k].util=v.u;out[k].dT=v.d}});
  return out;
}
function lotWeek(c,k){const ds=c.monDates.filter(d=>wkKey(d)===k);if(!ds.length)return null;return stats(c.mon.filter(m=>m.fecha===ds.at(-1))).rate}

function pair(S,f){const ks=Object.keys(S).filter(k=>S[k][f]!=null).sort();const c=ks.at(-1);if(!c)return {};const p=prevKey(c);return {c,p:S[p]&&S[p][f]!=null?p:null}}
function computeAlerts(cs,S){
  const A=[];const pp=v=>Math.round(v*100);const ws=(c,p)=>` (semana ${wkNum(p)} a ${wkNum(c)})`;
  const m=pair(S,"inc");
  if(m.p){const a=S[m.c],b=S[m.p];
    if(pp(a.inc-b.inc)>=ALERTAS.cultivo)A.push({sev:.85,h:`La incidencia del cultivo subió ${pp(a.inc-b.inc)} puntos`,p:`Pasó de ${pct(b.inc)} a ${pct(a.inc)} de puntos afectados${ws(m.c,m.p)}.`});
    Object.entries(a.pest).forEach(([p,v])=>{const o=b.pest[p];
      if(!o){if(v>0)A.push({sev:.7,h:`Apareció ${p}`,p:`No se vio en la semana ${wkNum(m.p)}; en la ${wkNum(m.c)} está en ${pct(v)} de los puntos.`})}
      else if(pp(v-o)>=ALERTAS.plaga)A.push({sev:.75,h:`${p} subió ${pp(v-o)} puntos`,p:`Pasó de ${pct(o)} a ${pct(v)} de los puntos inspeccionados${ws(m.c,m.p)}.`})});
    cs.filter(c=>c.active).forEach(c=>{const x=lotWeek(c,m.c),y=lotWeek(c,m.p);if(x!=null&&y!=null&&pp(x-y)>=ALERTAS.lote)A.push({sev:Math.min(1,.5+x/2),h:`${c.lote} empeoró ${pp(x-y)} puntos`,p:`Pasó de ${pct(y)} a ${pct(x)} de puntos afectados${ws(m.c,m.p)}.`,lot:c.id})});
  }
  const t=pair(S,"trap");
  if(t.p&&S[t.p].trap>0){const a=S[t.c],b=S[t.p],d=(a.trap-b.trap)/b.trap;if(d*100>=ALERTAS.trampas)A.push({sev:.7,h:`Los insectos en trampas subieron ${Math.round(d*100)}%`,p:`De ${num(Math.round(b.trap))} a ${num(Math.round(a.trap))} insectos por lectura${ws(t.c,t.p)}.${a.trapN<LECTURAS_SEMANA?" La semana aún no tiene todas sus lecturas.":""}`})}
  const s=pair(S,"desc");
  if(s.p){const a=S[s.c],b=S[s.p];if(pp(a.desc-b.desc)>=ALERTAS.descarte)A.push({sev:.8,h:`El descarte en sala subió ${pp(a.desc-b.desc)} puntos`,p:`Pasó de ${pct(b.desc)} a ${pct(a.desc)} de lo cosechado${ws(s.c,s.p)}.`})}
  return A.sort((x,y)=>y.sev-x.sev);
}

function niceMax(v,isPct){if(isPct){const c=[.1,.2,.3,.4,.5,.6,.8,1];return c.find(x=>x>=v*1.05)||1}
  const e=Math.pow(10,Math.floor(Math.log10(Math.max(v,1))));for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]){if(m*e>=v*1.08)return m*e}return 10*e}
function lineChart(keys,series,{fmt=v=>pct(v),min=0,isPct=true,wide=false}={}){
  const sm=window.innerWidth<600;const W=sm?340:(wide?1000:520),H=sm?200:(wide?250:190),L=42,R=28,T=14,B=26;
  const vals=series.flatMap(s=>s.values.filter(v=>v!=null));
  const hi=niceMax(Math.max(...vals,isPct?.05:1),isPct);
  const X=i=>keys.length<2?L+(W-L-R)/2:L+i*(W-L-R)/(keys.length-1);
  const Y=v=>T+(1-(v-min)/(hi-min))*(H-T-B);
  const C=getComputedStyle(document.documentElement);const line=C.getPropertyValue("--line").trim()||"#5E8C79",mut=C.getPropertyValue("--muted").trim()||"#DCEBE3";
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let g=0;g<=4;g++){const v=min+(hi-min)*g/4;const y=Y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="${line}" stroke-width="1"/><text x="${L-6}" y="${y+4}" font-size="11" fill="${mut}" text-anchor="end">${fmt(v)}</text>`}
  const step=Math.ceil(keys.length/8);
  keys.forEach((k,i)=>{if(i%step===0||i===keys.length-1)s+=`<text x="${X(i)}" y="${H-6}" font-size="11" fill="${mut}" text-anchor="middle">Sem ${wkNum(k)}</text>`});
  series.forEach(se=>{
    let d="",open=false;se.values.forEach((v,i)=>{if(v==null){open=false;return}d+=(open?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" ";open=true});
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.values.forEach((v,i)=>{if(v==null)return;const last=i===se.values.length-1;s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${last?4.5:3}" fill="${se.color}"><title>${esc(se.name)}, semana ${wkNum(keys[i])}: ${fmt(v)}</title></circle>`});
  });
  return s+`</svg>`;
}

function renderWeeks(){
  const cs=visible();const S=weeklySeries(cs);
  const keys=Object.keys(S).sort().slice(-12);
  const head=document.getElementById("wkHead"),charts=document.getElementById("charts"),lc=document.getElementById("lotChanges");
  if(!keys.length){head.innerHTML=`<p class="ok">Todavía no hay datos semanales para comparar.</p>`;charts.innerHTML="";lc.innerHTML="";return}
  const cur=keys.at(-1),prv=prevKey(cur);const hasPrev=keys.length>1;
  const A=computeAlerts(cs,S);
  head.innerHTML=`<h2 class="t">Semana ${wkNum(cur)}${S[prv]?` vs. semana ${wkNum(prv)}`:""}</h2>
    <p class="s">${hasPrev?`Alertas según los límites acordados: cultivo +${ALERTAS.cultivo} puntos, lote +${ALERTAS.lote}, plaga +${ALERTAS.plaga} o nueva, trampas +${ALERTAS.trampas}%, descarte +${ALERTAS.descarte} puntos.`:"La comparación aparece cuando haya dos semanas seguidas con datos."}</p>
    ${hasPrev?(A.length?`<div class="alerts">${A.map(a=>{const k=col(a.sev);return `<div class="alert" style="--c:${k.bg}"${a.lot!=null?` data-lot="${a.lot}" role="button" tabindex="0"`:""}><b>${esc(a.h)}</b><span>${esc(a.p)}</span></div>`}).join("")}</div>`:`<p class="ok">Sin alertas esta semana: ningún indicador superó los límites.</p>`):""}`;
  head.querySelectorAll("[data-lot]").forEach(e=>{e.style.cursor="pointer";e.onclick=()=>openLot(+e.dataset.lot,e)});
  const v=f=>keys.map(k=>S[k]&&S[k][f]!=null?S[k][f]:null);
  const card=(title,cap,nowTxt,chart,legend="")=>`<div class="panel chart"><h3>${title}</h3><p class="cap">${cap}</p>${nowTxt}${chart}${legend}</div>`;
  const now=(f,fm,isPct=true)=>{const q=pair(S,f);if(!q.c)return "";const a=S[q.c][f];let d="";
    if(q.p){const b=S[q.p][f];const x=isPct?Math.round((a-b)*100):(b?Math.round((a-b)/b*100):0);
      d=x?`<span class="note" style="margin:0">${x>0?"▲":"▼"} ${Math.abs(x)}${isPct?" puntos":"%"} vs. semana ${wkNum(q.p)}</span>`:`<span class="note" style="margin:0">igual que la semana ${wkNum(q.p)}</span>`}
    return `<div class="now"><b>${fm(a)}</b><span class="note" style="margin:0">Semana ${wkNum(q.c)}</span>${d}</div>`};
  // 1. Incidencia
  const inc=v("inc");
  let html=card("Incidencia del cultivo","Porcentaje de puntos inspeccionados con alguna plaga o enfermedad.",
    now("inc",pct),
    lineChart(keys,[{name:"Incidencia",color:SERIES_COL[0],values:inc}]));
  // 2. Plagas principales
  const tot={};keys.forEach(k=>Object.entries(S[k].pest||{}).forEach(([p,x])=>tot[p]=(tot[p]||0)+x));
  const top=Object.entries(tot).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  const pser=top.map((p,i)=>({name:p,color:SERIES_COL[i%SERIES_COL.length],values:keys.map(k=>S[k].inc!=null?(S[k].pest[p]||0):null)}));
  html+=card("Plagas y enfermedades principales","Porcentaje de puntos donde aparece cada una.","",
    pser.length?lineChart(keys,pser):`<p class="empty">Sin monitoreos todavía.</p>`,
    `<div class="lg">${pser.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)} ${s.values.at(-1)!=null?pct(s.values.at(-1)):""}</span>`).join("")}</div>`);
  // 3. Trampas
  const tr=v("trap");
  html+=card("Trampas de insectos","Promedio de insectos por lectura (lunes y miércoles).",
    now("trap",x=>num(Math.round(x)),false),
    tr.some(x=>x!=null)?lineChart(keys,[{name:"Insectos por lectura",color:SERIES_COL[2],values:tr}],{fmt:x=>num(Math.round(x)),isPct:false}):`<p class="empty">Sin lecturas de trampas todavía.</p>`);
  // 4. Descarte
  const de=v("desc");
  html+=card("Descarte en sala","Porcentaje de lo cosechado que se descarta.",
    now("desc",pct),
    de.some(x=>x!=null)?lineChart(keys,[{name:"Descarte",color:SERIES_COL[3],values:de}]):`<p class="empty">Sin ingresos a sala todavía.</p>`);
  charts.innerHTML=html;
  // Lotes que más cambiaron
  const mp=pair(S,"inc");const lcur=mp.c,lprv=mp.p;
  if(!lprv){lc.innerHTML=`<h2>Lotes que más cambiaron</h2><p class="note">Aparece cuando un lote tenga monitoreo en dos semanas seguidas.</p>`;return}
  const rows=cs.filter(c=>c.active).map(c=>({c,x:lotWeek(c,lcur),y:lotWeek(c,lprv)})).filter(r=>r.x!=null&&r.y!=null).map(r=>({...r,d:r.x-r.y})).sort((a,b)=>b.d-a.d);
  lc.innerHTML=`<h2>Lotes que más cambiaron</h2><p class="hint" style="margin:0 0 12px;color:var(--muted);font-size:13px">Incidencia de cada lote en su último monitoreo de cada semana. Toca un lote para ver su historia.</p>`+
    (rows.length?`<div class="scroll"><table class="chg"><thead><tr><th>Lote</th><th>Sem ${wkNum(lprv)}</th><th>Sem ${wkNum(lcur)}</th><th>Cambio</th></tr></thead><tbody>${rows.map((r,i)=>{const k=r.d>0?col(Math.min(1,.4+r.d*2)):null;
      return `<tr data-lot="${r.c.id}" style="cursor:pointer"${i>=8&&!lc.dataset.all?" hidden":""}><td>${esc(r.c.lote)}</td><td>${pct(r.y)}</td><td>${pct(r.x)}</td><td class="d" style="color:${r.d>0?k.bg:"var(--leaf)"}">${r.d>0?"▲":r.d<0?"▼":""} ${Math.abs(Math.round(r.d*100))} pts</td></tr>`}).join("")}</tbody></table></div>${rows.length>8?`<button class="more" id="moreLots">${lc.dataset.all?"Ver solo los 8 que más cambiaron":"Ver los "+rows.length+" lotes"}</button>`:""}`:`<p class="empty">Ningún lote tiene monitoreo en las dos semanas todavía.</p>`);
  const ml=document.getElementById("moreLots");if(ml)ml.onclick=()=>{lc.dataset.all=lc.dataset.all?"":"1";renderWeeks()};
  lc.querySelectorAll("[data-lot]").forEach(e=>e.onclick=()=>openLot(+e.dataset.lot,e));
}

function renderTraps(){
  const el=document.getElementById("traps");
  const rows=(RAW.trampas||[]).filter(r=>r.finca===state.finca&&r.fecha);
  if(!rows.length){el.hidden=true;return}
  el.hidden=false;
  const names=(rows.find(r=>r.n&&r.n.length)||{}).n||rows[0].t.map((_,i)=>"Trampa_"+(i+1));
  const W={};rows.forEach(r=>{const k=wkKey(r.fecha);const w=(W[k]??={k,sem:r.semana||isoWeek(r.fecha).w,t:names.map(()=>0),n:0});r.t.forEach((v,i)=>w.t[i]+=(+v||0));w.n++});
  const weeks=Object.values(W).sort((a,b)=>a.k<b.k?-1:1);const cur=weeks.at(-1),prev=weeks.at(-2);
  const tot=w=>w.t.reduce((a,b)=>a+b,0);const T=tot(cur);
  const avg=w=>tot(w)/Math.max(1,w.n);   // promedio por lectura: compara bien aunque falte una lectura
  const LPS=LECTURAS_SEMANA;
  let delta="";
  if(prev){const p=avg(prev),d=p?(avg(cur)-p)/p:null;
    if(d!=null){const up=d>0.001;const k=up?col(Math.min(1,.45+d)):null;
      delta=`<span class="delta" style="background:${up?k.bg:"var(--soft)"};color:${up?k.fg:"var(--ink)"}">${up?"Sube":"Baja"} ${Math.abs(Math.round(d*100))}% vs. semana ${prev.sem}</span>`}}
  else delta=`<p class="note">La comparación semanal aparece desde la segunda semana de lectura.</p>`;
  const mx=Math.max(...cur.t,1);
  const label=n=>n.replace(/_/g," ").replace(/^trampa/i,"Trampa");
  const recent=weeks.slice(-8);const mA=Math.max(...recent.map(avg),1);
  const svg=`<div class="wk" role="img" aria-label="Promedio de insectos por lectura, por semana">${recent.map((w,i)=>{const last=i===recent.length-1;
    return `<div class="wkc" title="Semana ${w.sem}: ${num(tot(w))} insectos en ${w.n} lectura${w.n>1?"s":""}"><span class="wkv">${num(Math.round(avg(w)))}</span><span class="wkb" style="height:${Math.max(3,Math.round(avg(w)/mA*100))}px;background:${last?"var(--gold)":"var(--soft)"}${w.n<LPS?";opacity:.55":""}"></span><span class="wkl">Sem ${w.sem}${w.n<LPS?"*":""}</span></div>`}).join("")}</div>
    <p class="note" style="font-size:12px">Promedio de insectos por lectura.${recent.some(w=>w.n<LPS)?` *Semana con menos de ${LPS} lecturas.`:""}</p>`;
  el.innerHTML=`<div><h2>Trampas de insectos</h2><p class="lbl" style="margin-top:2px">Semana ${cur.sem}, ${names.length} trampas a lo largo del cultivo</p>
      <span class="big">${num(T)}</span><p class="note" style="margin:2px 0 0">insectos capturados, ${cur.n} de ${LPS} lecturas de la semana</p>${delta}</div>
    <div><p class="lbl">Por trampa</p>${names.map((n,i)=>`<div class="trow"><span>${esc(label(n))}</span><span class="bar"><i style="width:${cur.t[i]/mx*100}%"></i></span><span class="v">${num(cur.t[i])}</span></div>`).join("")}</div>
    <div><p class="lbl">Evolución por semana</p>${svg}</div>`;
}

let lastFocus=null;
function openLot(id,from){
  lastFocus=from;const c=M.cycles[id];const dr=document.getElementById("drawer");
  const prevCycles=M.cycles.filter(x=>x.finca===c.finca&&x.lote===c.lote&&x.id!==c.id&&x.inicio<c.inicio);
  const pcol=v=>col(v);
  const s=c.inc;
  // Monitoreo
  let monHTML;
  if(!s.points)monHTML=`<p class="empty">Este lote aún no tiene monitoreo en su ciclo actual.</p>`;
  else{
    const pests=Object.entries(s.pest).sort((a,b)=>b[1]-a[1]);
    const beds=c.cur.slice().sort((a,b)=>a.cama-b.cama);
    const sano=isDark()?"#4E9A74":"#7DBB98",bad=col(.95).bg;
    const hist=c.monDates.length>1?`<p class="note">Historial: ${c.monDates.map(d=>{const st=stats(c.mon.filter(m=>m.fecha===d));return fmtS(d)+" "+pct(st.rate)}).join(", ")}</p>`:"";
    monHTML=`<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="big">${pct(s.rate)}</span><span class="note" style="margin:0">de puntos afectados el ${fmt(c.lastMon)}</span></div>
      <div class="meter" style="margin:10px 0 12px"><i style="width:${s.rate*100}%;background:${col(s.rate).bg}"></i></div>
      ${pests.map(([k,v])=>`<span class="chip">${esc(k)} ${pct(v/s.points)}</span>`).join("")}
      <p class="note">${s.beds} camas monitoreadas${c.camas?" de "+c.camas:""}, 3 puntos por cama.</p>
      <div class="beds" aria-label="Mapa de camas">${beds.map(b=>`<button class="bed" data-d="${esc("Cama "+b.cama+": "+b.pts.map((p,i)=>"punto "+(i+1)+" "+(p.length?p.join(", "):"sano")).join("; "))}" title="Cama ${b.cama}: ${b.pts.map((p,i)=>"P"+(i+1)+" "+(p.length?p.join(", "):"sano")).join(" · ")}"><small>${b.cama}</small><span class="dots">${b.pts.map(p=>`<i style="background:${p.length?bad:sano}"></i>`).join("")}</span></button>`).join("")}</div>
      <div class="key"><span><i style="background:${sano}"></i>Punto sano</span><span><i style="background:${bad}"></i>Punto afectado</span></div><p class="note" id="bedInfo">Toca una cama para ver qué se encontró en cada punto.</p>${hist}`;
  }
  // Fumigación

  // Abonadas
  const names=["1era","2da","3era","4ta","5ta"];const nAb=s=>parseInt(String(s||"").replace(/\D/g,""))||0;

  const abHTML=`<span class="big">${c.abon.length}</span><div class="steps">${names.map((n,i)=>{const a=c.abon.find(x=>nAb(x.num)===i+1);const opc=i===4&&!a;return `<span class="${a?"done":""}" title="${a?esc(fmt(a.fecha)+": "+(a.prod||"")):opc?"Opcional, no todos los lotes la llevan":"Pendiente"}"${opc?' style="opacity:.55;background:transparent;box-shadow:inset 0 0 0 1.5px var(--soft)"':""}>${n}</span>`}).join("")}</div><p class="note">${c.abon.length?"Última: "+fmt(c.abon.at(-1).fecha)+(c.abon.at(-1).prod?", "+esc(c.abon.at(-1).prod):""):"Sin abonadas registradas todavía."}${extra.length?" Además "+extra.length+" registro(s) sin número.":""}</p>`;
  // Sala
  c.sala.sort((x,y)=>x.fecha<y.fecha?-1:1);
  const agg=rows=>{const o={u:0,d:0,tipo:{},mot:{}};rows.forEach(r=>{o.u+=r.util;o.d+=r.desc;if(r.util)o.tipo[r.tipo||"Sin variedad"]=(o.tipo[r.tipo||"Sin variedad"]||0)+r.util;if(r.desc)o.mot[r.motivo||"Sin motivo"]=(o.mot[r.motivo||"Sin motivo"]||0)+r.desc});return o};
  const chips=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="chip">${esc(k)} ${num(v)}</span>`).join("");
  const wkNow=wkKey(todayStr),wkN=isoWeek(todayStr).w;
  const S=agg(c.sala),Wk=agg(c.sala.filter(r=>wkKey(r.fecha)===wkNow));
  const block=(o,titulo,sub)=>{const tot=o.u+o.d;return `<p class="note" style="margin:0 0 2px;font-weight:600;color:var(--ink)">${titulo}</p>
    <span class="big">${num(o.u)}</span><p class="note" style="margin-top:2px">${sub}</p>
    ${o.u?`<div style="margin-top:6px">${chips(o.tipo)}</div>`:""}
    ${o.d?`<p class="note">Descarte: <b style="color:var(--ink)">${num(o.d)}</b> (${pct(o.d/tot)})</p><div style="margin-top:4px">${chips(o.mot)}</div>`:(o.u?`<p class="note">Sin descarte.</p>`:"")}`};
  const salaHTML=c.sala.length?`${block(Wk,`Esta semana (semana ${wkN})`,Wk.u||Wk.d?"tallos útiles":"Sin ingresos esta semana.")}
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">${block(S,"Acumulado del lote",`tallos útiles, último ingreso el ${fmt(c.sala.at(-1).fecha)}`)}
    ${S.d?`<div class="meter" style="margin:8px 0 0"><i style="width:${S.d/(S.u+S.d)*100}%;background:${col(S.d/(S.u+S.d)).bg}"></i></div>`:""}</div>`:`<p class="empty">Sin ingresos a sala registrados en este ciclo.</p>`;
  // Preparación

    ${timeline(c,tw)}</div>

    </div>

  dr.querySelector(".close").onclick=closeLot;
  dr.querySelectorAll(".bed").forEach(b=>b.onclick=()=>{dr.querySelectorAll(".bed").forEach(x=>x.style.outline="");b.style.outline="2px solid var(--blue)";dr.querySelector("#bedInfo").textContent=b.dataset.d});

function estEnd(ini,tw){const d=D(ini);d.setDate(d.getDate()+tw*7);return d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear()}
function closeLot(){document.getElementById("scrim").classList.remove("on");document.getElementById("drawer").classList.remove("on");if(lastFocus)lastFocus.focus()}
document.getElementById("scrim").onclick=closeLot;

/* Línea de tiempo del ciclo */
function timeline(c,tw){
  const span=Math.max(tw,c.weeks,1)*7;const W=500,L=78,R=10,H=128;
  const x=d=>L+Math.max(0,Math.min(1,days(c.inicio,d)/span))*(W-L-R);
  const lanes=[["Preparación",22],["Abonadas",48],["Fumigación",74],["Monitoreo",100]];
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Línea de tiempo del ciclo" style="margin-top:14px;overflow:visible">`;
  lanes.forEach(([n,y])=>{s+=`<text x="0" y="${y+4}" font-size="11" fill="var(--muted)">${n}</text><line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/>`});
  for(let k=0;k<=span/7;k+=4){const xx=L+(k*7/span)*(W-L-R);s+=`<text x="${xx}" y="${H-4}" font-size="10" fill="var(--muted)" text-anchor="middle">${k}</text>`}
  const now=c.fin||todayStr;const nx=x(now);
  s+=`<line x1="${nx}" x2="${nx}" y1="10" y2="${H-16}" stroke="var(--blue)" stroke-dasharray="3 3"/><text x="${nx}" y="8" font-size="10" fill="var(--blue)" text-anchor="middle">${c.fin?"fin":"hoy"}</text>`;
  if(c.prep)[c.prep.desinf,c.prep.app1,c.prep.app2].filter(Boolean).forEach(d=>{s+=`<rect x="${x(d)-4}" y="18" width="8" height="8" transform="rotate(45 ${x(d)} 22)" fill="var(--muted)"><title>${fmt(d)}</title></rect>`});
  c.abon.forEach(a=>{s+=`<circle cx="${x(a.fecha)}" cy="48" r="7" fill="var(--leaf)"><title>${a.num||""} abonada, ${fmt(a.fecha)}</title></circle><text x="${x(a.fecha)}" y="51.5" font-size="9" fill="#173428" text-anchor="middle" font-weight="700">${(a.num||"").replace(/\D/g,"")}</text>`});
  c.fum.forEach(f=>{const xx=x(f.fecha);s+=`<path d="M${xx} 67 L${xx+6} 79 L${xx-6} 79 Z" fill="#C98A2E"><title>${fmt(f.fecha)}: ${esc(f.plagas||"")}</title></path>`});
  c.monDates.forEach(d=>{const st=stats(c.mon.filter(m=>m.fecha===d));s+=`<rect x="${x(d)-5}" y="95" width="10" height="10" rx="2" fill="${col(st.rate).bg}" stroke="var(--line)"><title>${fmt(d)}: ${pct(st.rate)}</title></rect>`});
  s+=`<text x="0" y="${H-4}" font-size="10" fill="var(--muted)">Semana</text></svg>`;
  return s;
}

/* ---------- Despachos ---------- */
state.dp={preset:"4s",desde:null,hasta:null,com:null,all:false};
const addDays=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esAnulado=r=>/anulad/i.test(r.comercializadora||"")||/anulad/i.test(r.nombre||"");
function despAnulados(){return (RAW.despachos||[]).filter(r=>r.fecha&&r.finca===state.finca&&esAnulado(r))}
function despRows(){
  const all=(RAW.despachos||[]).filter(r=>!esAnulado(r));const mp={};
  all.forEach(r=>{if(r.nombre){const k=(r.variedad||"")+"|"+(r.tipo||"");(mp[k]??={})[r.nombre]=(mp[k][r.nombre]||0)+1}});
  return all.filter(r=>r.fecha&&r.finca===state.finca&&(state.variedad==="Todas"||r.variedad===state.variedad)).map(r=>{
    let n=r.nombre,inf=false;
    if(!n){const m=mp[(r.variedad||"")+"|"+(r.tipo||"")];n=m?Object.entries(m).sort((a,b)=>b[1]-a[1])[0][0]:[r.variedad,r.tipo].filter(Boolean).join(" ")||"Sin nombre";inf=true}

function dpRange(rows){
  const p=state.dp.preset,hoy=todayStr;

  if(p==="4s")return [addDays(hoy,-27),hoy];
  if(p==="mes")return [hoy.slice(0,8)+"01",hoy];
  if(p==="todo"){const f=rows.map(r=>r.fecha).sort();return f.length?[f[0],f.at(-1)]:[hoy,hoy]}

}

      ${state.dp.com?`<button class="more" id="dpClear">Ver todas las comercializadoras</button>`:""}</div>
  </div>`;
  // Gráfica semanal
  const wEnd=wkKey(b),wk=[];for(let d=a;;d=addDays(d,7)){const k=wkKey(d);if(!wk.includes(k))wk.push(k);if(k>=wEnd||wk.length>120)break}if(!wk.includes(wEnd))wk.push(wEnd);
  const byW={};inR.forEach(r=>{const k=wkKey(r.fecha);(byW[k]??={_t:0});byW[k]._t+=r.q;const c=r.comercializadora||"Sin comercializadora";byW[k][c]=(byW[k][c]||0)+r.q});

    <tfoot><tr><td>Total</td>${cols.length>1?cols.map(c=>`<td class="r">${num(sel.filter(r=>(r.comercializadora||"Sin comercializadora")===c).reduce((s,r)=>s+r.q,0))}</td>`).join(""):""}<td class="r">${num(ST)}</td><td class="r">100%</td></tr></tfoot></table></div>

/* ---------- Balance de sala: lo que entra útil vs. lo que se despacha ---------- */
const DIAS_MAX_SALA=7;
function tipoStd(s){const k=String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();if(!k)return "Sin tipo";if(k.startsWith("selec"))return "Select";return k.charAt(0).toUpperCase()+k.slice(1)}
function balanceSala(a,b){
  const ent=[];M.cycles.filter(c=>c.finca===state.finca&&(state.variedad==="Todas"||c.variedad===state.variedad)).forEach(c=>c.sala.forEach(r=>{if(r.util)ent.push({fecha:r.fecha,k:c.variedad||"Sin variedad",det:tipoStd(r.tipo),q:r.util});if(r.desc)ent.push({fecha:r.fecha,k:null,d:r.desc})}));
  if(!ent.length)return `<details class="panel dp-panel bal-d" id="balD"${state.dp.balOpen?" open":""}><summary><span class="bt">Balance de sala</span><span class="bs">Sin ingresos a sala</span></summary><p class="note">Aparece cuando haya ingresos a sala registrados para ${esc(state.finca)}.</p></details>`;
  const ini=ent.map(r=>r.fecha).sort()[0];
  const vf={};M.cycles.filter(c=>c.finca===state.finca).forEach(c=>vf[c.variedad]=1);
  /* Solo se cuadran variedades con lotes en esta finca; las demás (tallos que salen distinto en un lote) son extras */
  const todo=despRows().filter(r=>r.fecha>=ini);
  const sal=todo.filter(r=>vf[r.variedad]).map(r=>({fecha:r.fecha,k:r.variedad,det:tipoStd(r.tipo),q:r.q}));
  const extr={};todo.filter(r=>!vf[r.variedad]&&r.fecha>=a&&r.fecha<=b).forEach(r=>{const n=r.variedad||"Sin variedad";extr[n]=(extr[n]||0)+r.q});
  const extTxt=Object.entries(extr).sort((x,y)=>y[1]-x[1]).map(([n,v])=>esc(n)+" "+num(v)).join(", ");
  const keys=[...new Set(ent.filter(r=>r.k).map(r=>r.k).concat(sal.map(r=>r.k)))];
  const sum=(arr,f)=>arr.reduce((s,r)=>s+(f(r)||0),0);
  const hasta=(arr,d)=>arr.filter(r=>r.fecha<=d);
  const util7=(k,d)=>sum(ent.filter(r=>r.k===k&&r.fecha<=d&&r.fecha>addDays(d,-DIAS_MAX_SALA)),r=>r.q);
  const fin=b>todayStr?todayStr:b;
  const detTxt=(arr,k)=>{const o={};arr.filter(r=>r.k===k&&r.fecha>=a&&r.fecha<=b).forEach(r=>o[r.det]=(o[r.det]||0)+r.q);return Object.entries(o).sort((x,y)=>y[1]-x[1]).map(([n,v])=>esc(n)+" "+num(v)).join(", ")};
  const rows=keys.map(k=>{const eR=sum(ent.filter(r=>r.k===k&&r.fecha>=a&&r.fecha<=b),r=>r.q),dR=sum(sal.filter(r=>r.k===k&&r.fecha>=a&&r.fecha<=b),r=>r.q);
    const saldo=sum(hasta(ent,fin).filter(r=>r.k===k),r=>r.q)-sum(hasta(sal,fin).filter(r=>r.k===k),r=>r.q);const lim=util7(k,fin);
    const st=saldo<0?"neg":saldo>lim?"old":"ok";return {v:k,eR,dR,saldo,lim,st,de:detTxt(ent,k),dd:detTxt(sal,k)}}).filter(r=>r.eR||r.dR||r.saldo).sort((x,y)=>x.v.localeCompare(y.v));
  const E=sum(ent.filter(r=>r.k&&r.fecha>=a&&r.fecha<=b),r=>r.q),X=sum(ent.filter(r=>!r.k&&r.fecha>=a&&r.fecha<=b),r=>r.d),S=sum(sal.filter(r=>r.fecha>=a&&r.fecha<=b),r=>r.q);
  const saldoT=sum(hasta(ent,fin).filter(r=>r.k),r=>r.q)-sum(hasta(sal,fin),r=>r.q),limT=sum(ent.filter(r=>r.k&&r.fecha<=fin&&r.fecha>addDays(fin,-DIAS_MAX_SALA)),r=>r.q);
  const stT=saldoT<0?"neg":saldoT>limT?"old":"ok";
  const lbl={neg:"Faltan ingresos",old:`Flor de más de ${DIAS_MAX_SALA} días`,ok:"En orden"};
  const sc={neg:col(.95).bg,old:"#E8C28F",ok:"var(--leaf)"};
  const msg=stT==="neg"?`Se ha despachado ${num(-saldoT)} tallos más de lo que entró útil a sala. Probablemente faltan ingresos a sala por registrar.`
    :stT==="old"?`Quedan ${num(saldoT)} tallos en cuarto frío, pero en los últimos ${DIAS_MAX_SALA} días solo entraron ${num(limT)}. Hay flor de más de ${DIAS_MAX_SALA} días, o despachos o descartes sin registrar.`
    :`Quedan ${num(saldoT)} tallos en cuarto frío, todos de los últimos ${DIAS_MAX_SALA} días.`;
  // saldo al final de cada semana del rango
  const wks=[];for(let d=a;;d=addDays(d,7)){const k=wkKey(d);if(!wks.includes(k))wks.push(k);if(d>=b||wks.length>60)break}if(!wks.includes(wkKey(b)))wks.push(wkKey(b));
  const endOf=k=>{let e=a;for(let d=a;d<=fin;d=addDays(d,1))if(wkKey(d)===k)e=d;return e};
  const sv=wks.map(k=>{const e=endOf(k);if(e<ini||e>fin)return null;return sum(hasta(ent,e).filter(r=>r.k),r=>r.q)-sum(hasta(sal,e),r=>r.q)});
  const lv=wks.map(k=>{const e=endOf(k);if(e<ini||e>fin)return null;return sum(ent.filter(r=>r.k&&r.fecha<=e&&r.fecha>addDays(e,-DIAS_MAX_SALA)),r=>r.q)});
  const chart=sv.filter(x=>x!=null).length>1?`<div style="margin-top:14px">${lineChart(wks,[{name:"En cuarto frío",color:SERIES_COL[0],values:sv},{name:`Entró en los últimos ${DIAS_MAX_SALA} días`,color:SERIES_COL[3],values:lv}],{fmt:x=>num(Math.round(x)),isPct:false,wide:true})}
    <div class="lg"><span><i style="background:${SERIES_COL[0]}"></i>En cuarto frío al cierre de cada semana</span><span><i style="background:${SERIES_COL[3]}"></i>Lo que entró en los últimos ${DIAS_MAX_SALA} días (máximo razonable)</span></div></div>`:"";
  return `<details class="panel dp-panel bal-d" id="balD"${state.dp.balOpen?" open":""}><summary><span class="bt">Balance de sala</span><span class="st" style="--c:${sc[stT]}">${lbl[stT]}</span><span class="bs">${num(saldoT)} tallos en cuarto frío</span></summary>
    <p class="hint" style="margin:2px 0 12px;color:var(--muted);font-size:13px">Lo que entra útil a sala menos lo que se despacha. Se cuenta desde el primer ingreso registrado (${fmt(ini)}).</p>
    <div class="bal">
      <div><span>Entró a sala</span><b>${num(E+X)}</b></div><div><span>Descarte</span><b>${num(X)}</b></div><div><span>Entró útil</span><b>${num(E)}</b></div><div><span>Despachado</span><b>${num(S)}</b></div>
      <div class="hl" style="--c:${sc[stT]}"><span>Hoy en cuarto frío</span><b>${num(saldoT)}</b></div></div>
    <p class="balmsg" style="--c:${sc[stT]}"><b>${lbl[stT]}.</b> ${msg}</p>
    ${extTxt?`<p class="note" style="margin-top:10px">Extras despachados, sin lote propio en ${esc(state.finca)} y fuera del balance: ${extTxt}.</p>`:""}
    ${chart}
    <h3 style="font:600 14px var(--body);margin:18px 0 6px">Por variedad</h3>
    <div class="scroll"><table class="chg"><thead><tr><th>Variedad</th><th class="r">Entró útil</th><th class="r">Despachado</th><th class="r">En cuarto frío</th><th class="est">Estado</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.v)}</td><td class="r">${num(r.eR)}</td><td class="r">${num(r.dR)}</td><td class="r"><b${r.st!=="ok"?` style="color:${r.st==="neg"?"#FFB4B4":"#E8C28F"}"`:""}>${num(r.saldo)}</b></td><td class="est"><span class="st" style="--c:${sc[r.st]}">${lbl[r.st]}</span></td></tr>
      <tr class="bd"><td colspan="5">${r.de?`<span>Entró: ${r.de}</span>`:""}${r.dd?`<span>Despachado: ${r.dd}</span>`:""}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note" style="font-size:12px">Entró útil y Despachado corresponden al rango elegido. En cuarto frío es el saldo acumulado a ${fmt(fin)}. El balance incluye todas las comercializadoras.</p></details>`;
}

function cargarXLSX(){return new Promise((ok,ko)=>{if(window.XLSX)return ok();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>ok();s.onerror=ko;document.head.appendChild(s)})}
async function descargarDespachos(btn){
  const ex=state.dp.export;if(!ex||!ex.rows.length)return;
  const det=ex.rows.map(r=>({"Fecha":r.fecha,"Despacho":(d=>/^\d+$/.test(d)?+d:d)(String(r.despacho||r.fito||"")),"Comercializadora":r.comercializadora||"","Finca":r.finca||"","Variedad":r.variedad||"","Tipo de flor":r.tipo||"","Nombre comercial":r.nc,"Cantidad":r.q,"Líder de sala":r.lider||"","Novedades":r.novedades||""}));
  const res={};ex.rows.forEach(r=>{const k=r.nc+"|"+(r.comercializadora||"");(res[k]??={"Nombre comercial":r.nc,"Comercializadora":r.comercializadora||"","Tallos":0});res[k].Tallos+=r.q});
  const resumen=Object.values(res).sort((x,y)=>x["Nombre comercial"]<y["Nombre comercial"]?-1:x["Nombre comercial"]>y["Nombre comercial"]?1:y.Tallos-x.Tallos);
  const name=`Despachos_${state.finca.replace(/\s+/g,"_")}${ex.com?"_"+ex.com.replace(/\s+/g,"_"):""}_${ex.a}_a_${ex.b}`;
  const txt=btn.textContent;btn.textContent="Preparando…";btn.disabled=true;
  try{await cargarXLSX();
    const wb=XLSX.utils.book_new();
    const serial=s=>{const [y,m,d]=s.split("-").map(Number);return (Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5};
    const s1=XLSX.utils.json_to_sheet(det.map(r=>({...r,"Fecha":serial(r.Fecha)})));
    for(let i=0;i<det.length;i++){const c=s1["A"+(i+2)];if(c){c.t="n";c.z="dd/mm/yyyy"}}s1["!cols"]=[{wch:11},{wch:10},{wch:20},{wch:14},{wch:12},{wch:12},{wch:20},{wch:10},{wch:24},{wch:40}];
    const s2=XLSX.utils.json_to_sheet(resumen);s2["!cols"]=[{wch:22},{wch:20},{wch:10}];
    XLSX.utils.book_append_sheet(wb,s1,"Detalle");XLSX.utils.book_append_sheet(wb,s2,"Resumen por producto");
    XLSX.writeFile(wb,name+".xlsx");
  }catch(e){ // sin conexión a la librería: CSV que Excel abre igual
    const cols=Object.keys(det[0]);const q=v=>`"${String(v).replace(/"/g,'""')}"`;
    const csv="﻿"+[cols.map(q).join(";")].concat(det.map(r=>cols.map(c=>q(r[c])).join(";"))).join("\r\n");
    const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const l=document.createElement("a");l.href=u;l.download=name+".csv";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
  }finally{btn.textContent=txt;btn.disabled=false}
}
